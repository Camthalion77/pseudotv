<div class="container-fluid">
  <h4>Global Language Preferences</h4>
  <p>Apply your preferred audio and subtitle language to all existing and future channels. Changes take effect on the next program.</p>
  <div ng-if="settings">
    <label><input type="checkbox" ng-model="settings.enabled"> Enable global language preferences</label>
    <div class="form-group"><label>Audio language (ISO code)</label>
      <input class="form-control" type="text" ng-model="settings.audio" placeholder="default / eng / ell" maxlength="6">
      <small>default = Plex selection; e.g. eng, ell, deu, fra</small></div>
    <div class="form-group"><label>Subtitle language (ISO code)</label>
      <input class="form-control" type="text" ng-model="settings.subtitles" placeholder="off / ell / eng" maxlength="6">
      <small>off = none; default = Plex selection</small></div>
    <div class="form-group"><label>Subtitle fallback</label>
      <input class="form-control" type="text" ng-model="settings.fallback" placeholder="off / eng" maxlength="6"></div>
    <label><input type="checkbox" ng-model="settings.forced"> Use available forced subtitles when preferred language is missing</label>
    <div><button class="btn btn-primary" ng-click="save()">Save preferences</button></div>
    <p class="text-success" ng-if="saved">Saved. Applies to the next program.</p>
    <p class="text-danger" ng-if="error">{{error}}</p>
  </div>
</div>
